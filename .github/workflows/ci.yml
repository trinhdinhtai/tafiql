name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    # Windows-first (ADR 0002): gpui builds natively on Windows runners
    # with no system dependencies to install.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Explicitly the version pinned in rust-toolchain.toml (AC: pinned
      # stable toolchain).
      - uses: dtolnay/rust-toolchain@1.99.1

      # rustup resolves the pinned toolchain from rust-toolchain.toml for
      # every command below; this ensures fmt/clippy exist in it.
      - name: Add fmt and clippy to the pinned toolchain
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # Criterion smoke: short measurements so CI stays fast while proving
      # the Performance Budget harness works end to end (ADR 0004).
      - name: Criterion smoke
        run: cargo bench -p tafiql-core --bench smoke -- --sample-size 10 --warm-up-time 1 --measurement-time 2

      # Runnable build, published as a downloadable artifact on every run.
      - name: Build release binary
        run: cargo build --release -p tafiql-app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tafiql-app-windows-x64
          path: target/release/tafiql-app.exe
          if-no-files-found: error
