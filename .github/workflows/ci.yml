name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build and test
        run: |
          if [ ! -f Cargo.toml ]; then
            echo "No Cargo.toml yet - CI activates cargo build/test once Rust code lands."
            exit 0
          fi
          cargo build --workspace --all-targets
          cargo test --workspace
